    <script>
      /* ------------------------------------------------------------------
         截图辅助：通过 URL 参数驱动界面状态。
           ?tab=saves      在详情页自动切到「存档」标签
           ?scroll=600     渲染完成后把主区域向下滚动指定像素
         仅用于产出 README 配图。
         ------------------------------------------------------------------ */
      (() => {
        const params = new URLSearchParams(location.search);
        const wantTab = params.get("tab");
        const scroll = Number(params.get("scroll") || 0);

        const LABELS = {
          overview: "概览",
          saves: "存档",
          notes: "攻略笔记",
          patches: "补丁",
          links: "资源链接",
          timeline: "游玩记录",
        };

        if (wantTab) {
          const label = LABELS[wantTab] ?? wantTab;
          let tries = 0;
          const timer = setInterval(() => {
            tries += 1;
            const btn = [...document.querySelectorAll("button")].find(
              (b) => b.textContent.trim() === label,
            );
            if (btn) {
              btn.click();
              clearInterval(timer);
            }
            if (tries > 200) clearInterval(timer);
          }, 50);
        }

        if (scroll) {
          const timer = setInterval(() => {
            const main = document.querySelector("main");
            const target =
              (main && main.querySelector(".scroll-y")) ?? document.scrollingElement;
            if (target && target.scrollHeight > target.clientHeight) {
              target.scrollTop = scroll;
              clearInterval(timer);
            }
          }, 50);
          setTimeout(() => clearInterval(timer), 9000);
        }
      })();
    </script>
